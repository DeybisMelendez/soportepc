[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "migrations",
    "media",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DJ"]

[tool.ruff.format]
docstring-code-format = true

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100